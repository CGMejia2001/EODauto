<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EODAuto Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #f8f8f2;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .card {
            background: #1f1f2e;
            border-radius: 16px;
            border: 1px solid #44475a;
            padding: 28px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 18px 40px rgba(0,0,0,.35);
        }
        h1 {
            margin-bottom: 12px;
            font-size: 2rem;
        }
        p {
            color: #c8c8d6;
            margin-bottom: 18px;
            line-height: 1.6;
        }
        pre {
            text-align: left;
            background: rgba(255,255,255,.05);
            padding: 16px;
            border-radius: 12px;
            overflow-x: auto;
            color: #f8f8f2;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>EODAuto Setup Test</h1>
        <p>This page is a dedicated local test stub for validating your EODAuto automation setup.</p>
        <p>If the userscript is installed and active, the Mission Control overlay should appear and report a verification handshake.</p>
        <div id="payloadInfo">
            <p><strong>Payload hash:</strong></p>
            <pre id="payloadText">Waiting for payload...</pre>
        </div>
    </div>
    <script>
        function readPayload() {
            if (!location.hash.startsWith('#eodauto=')) return null;
            try {
                return JSON.parse(decodeURIComponent(location.hash.substring(9)));
            } catch (error) {
                return { error: error.message };
            }
        }

        const payload = readPayload();
        const payloadText = document.getElementById('payloadText');
        if (payload) {
            payloadText.textContent = JSON.stringify(payload, null, 2);
        } else {
            payloadText.textContent = 'No valid #eodauto payload found. Open this page from EODAuto via the setup test button.';
        }
    </script>
</body>
</html>
